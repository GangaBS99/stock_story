server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy → FastAPI control plane (strips /api prefix)
    location /api/ {
        proxy_pass         http://control-plane:8500/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Langfuse iframe proxy — rewrites headers so Langfuse embeds inside the React app.
    # $LANGFUSE_HOST is substituted at container start by the CMD entrypoint.
    location /lf-proxy/ {
        proxy_pass         $LANGFUSE_HOST/;
        proxy_http_version 1.1;
        proxy_set_header   Host             $proxy_host;
        proxy_set_header   Accept-Encoding  "";
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Content-Security-Policy;
    }
}
