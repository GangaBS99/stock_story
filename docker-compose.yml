services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn control_plane.main:app --host 0.0.0.0 --port 8500 --reload
    ports:
      - "8500:8500"
    env_file: .env
    volumes:
      - .:/app
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - control-plane
    restart: unless-stopped
