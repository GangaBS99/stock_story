[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-sdk"
version = "1.0.0"
description = "Connector SDK for the Agent Observability Platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai>=0.0.20", "langfuse>=3.0.0", "opentelemetry-sdk>=1.24.0", "opentelemetry-exporter-otlp-proto-http>=1.24.0"]
langchain  = ["langchain>=0.2.0", "langchain-openai>=0.1.0"]
openai     = ["openai>=1.0.0", "langfuse>=3.0.0"]
all        = ["pydantic-ai>=0.0.20", "langchain>=0.2.0", "openai>=1.0.0", "langfuse>=3.0.0",
              "opentelemetry-sdk>=1.24.0", "opentelemetry-exporter-otlp-proto-http>=1.24.0"]

[tool.setuptools.packages.find]
include = ["sdk*"]
