services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn control_plane.main:app --host 0.0.0.0 --port 8500
    expose:
      - "8500"
    env_file: .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Langfuse iframe is served through the /lf-proxy/ nginx location
        VITE_LANGFUSE_URL: /lf-proxy
    environment:
      # Passed to nginx at runtime to fill the /lf-proxy/ proxy_pass target
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://langfuse.agenticorc.com}
    ports:
      - "80:80"
    depends_on:
      - control-plane
    restart: unless-stopped
